# Salin ke /etc/nginx/sites-available/kua lalu ganti DOMAIN_ANDA.
# Sertifikat HTTPS ditambahkan otomatis oleh: sudo certbot --nginx -d DOMAIN_ANDA

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    root /var/www/kua/public;
    index index.php;

    charset utf-8;

    # Pengajuan nikah bisa berisi 10 berkas x 2 MB.
    client_max_body_size 32M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset hasil build Vite punya hash di nama file, aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
